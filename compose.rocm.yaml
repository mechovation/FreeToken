# Standalone file: docker compose -f compose.rocm.yaml ...
services:
  freetoken-rocm:
    build:
      context: .
      dockerfile: docker/Dockerfile.rocm
      args:
        ROCM_IMAGE: ${ROCM_IMAGE:-rocm/pytorch:rocm7.2.2_ubuntu24.04_py3.12_pytorch_release_2.10.0}
        ROCM_DEPS_IMAGE: ${ROCM_DEPS_IMAGE:-rocm-deps}
    image: freetoken:rocm-gfx1201
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    shm_size: 4gb
    ports:
      - "${ROCM_BIND_ADDRESS:-127.0.0.1}:${ROCM_PORT:-1920}:1919"
    environment:
      HIP_VISIBLE_DEVICES: ${ROCM_DEVICE:-0}
      MODEL_PATH: ${ROCM_MODEL:-Qwen/Qwen3-0.6B}
      SERVED_MODEL_NAME: ${ROCM_MODEL_NAME:-Qwen3-0.6B}
      MEMORY_RATIO: ${ROCM_MEMORY_RATIO:-0.85}
      MAX_RUNNING_REQUESTS: ${ROCM_MAX_REQUESTS:-1}
      MAX_PREFILL_LENGTH: ${ROCM_PREFILL_LENGTH:-2048}
      KV_RESERVE_TOKENS: ${ROCM_KV_RESERVE_TOKENS:-2048}
      MOE_BACKEND: ${ROCM_MOE_BACKEND:-fused}
      FT_EXTRA_ARGS: ${ROCM_EXTRA_ARGS:-}
    volumes:
      - ${ROCM_MODELS_DIR:-./models}:/models:ro
      - ${ROCM_HF_CACHE:-./hf-cache}:/root/.cache/huggingface
      - rocm-kernels:/root/.cache
    command: ["serve", "--attention-backend", "triton", "--num-pages", "${ROCM_NUM_PAGES:-4096}", "--cuda-graph-max-bs", "${ROCM_GRAPH_MAX_BS:-0}"]

volumes:
  rocm-kernels:
